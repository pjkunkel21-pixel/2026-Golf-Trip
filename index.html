<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 Ryder Cup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Black&family=Azeret+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#E9E8E1;
  --card:#F8F7F2;
  --card-2:#F1F0E9;
  --ink:#191C17;
  --muted:#6B6F66;
  --faint:#9A9E93;
  --line:#D2D1C6;
  --line-soft:#E0DFD5;
  --ryan:#9B2F28;
  --ryan-soft:#9b2f2818;
  --pat:#1D5C68;
  --pat-soft:#1d5c6818;
  --neutral-fill:#CFCEC2;
  --shadow:0 1px 2px rgba(25,28,23,.05), 0 8px 24px -16px rgba(25,28,23,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --paper:#101410;
    --card:#191E19;
    --card-2:#141814;
    --ink:#E9ECE3;
    --muted:#8E948A;
    --faint:#6A7067;
    --line:#2A302A;
    --line-soft:#232823;
    --ryan:#E06A5F;
    --ryan-soft:#e06a5f1f;
    --pat:#54BACB;
    --pat-soft:#54bacb1f;
    --neutral-fill:#2E352E;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#101410;
  --card:#191E19;
  --card-2:#141814;
  --ink:#E9ECE3;
  --muted:#8E948A;
  --faint:#6A7067;
  --line:#2A302A;
  --line-soft:#232823;
  --ryan:#E06A5F;
  --ryan-soft:#e06a5f1f;
  --pat:#54BACB;
  --pat-soft:#54bacb1f;
  --neutral-fill:#2E352E;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  max-width:1060px;
  margin:0 auto;
  padding-inline:16px;
  padding-block:24px 56px;
}
h1,h2,h3{margin:0;text-wrap:balance}
.mono{font-family:"Azeret Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.eyebrow{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:600;color:var(--faint);
  font-family:"Azeret Mono",ui-monospace,monospace;
}

/* ---------- masthead ---------- */
.masthead{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;flex-wrap:wrap;
  padding-bottom:14px;margin-bottom:22px;
  border-bottom:1px solid var(--line);
}
.masthead h1{
  font-family:"Archivo Black","Archivo",sans-serif;
  font-size:clamp(19px,4.2vw,25px);
  letter-spacing:-.015em;line-height:1;
}
.masthead .meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
#refresh{
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:999px;
  padding:6px 13px;cursor:pointer;
}
#refresh:hover{background:var(--card-2)}
#refresh:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#refresh[data-busy="1"]{opacity:.5;pointer-events:none}

/* ---------- the score ---------- */
.scoreboard{margin-bottom:34px}
.score-row{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;gap:14px;
  margin-bottom:18px;
}
.team-name{
  font-family:"Archivo Black","Archivo",sans-serif;
  font-size:clamp(15px,3.4vw,23px);
  line-height:1.05;letter-spacing:-.01em;
}
.side-r{text-align:left;color:var(--ryan)}
.side-p{text-align:right;color:var(--pat)}
.team-sub{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--faint);margin-top:5px;
  font-family:"Azeret Mono",ui-monospace,monospace;
}
.tally{
  display:flex;align-items:center;gap:clamp(8px,2.5vw,18px);
  font-family:"Archivo Black","Archivo",sans-serif;
  font-size:clamp(38px,11vw,68px);
  line-height:.9;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
}
.tally .r{color:var(--ryan)}
.tally .p{color:var(--pat)}
.tally .dash{color:var(--line);font-size:.55em;transform:translateY(-.08em)}

/* points track */
.track{
  position:relative;height:38px;border-radius:5px;overflow:hidden;
  background:var(--neutral-fill);border:1px solid var(--line);
  display:flex;
}
.track .fill-r{background:var(--ryan);height:100%;flex:0 0 auto;transition:width .5s cubic-bezier(.4,0,.2,1)}
.track .fill-spacer{flex:1 1 auto;min-width:0}
.track .fill-p{background:var(--pat);height:100%;flex:0 0 auto;transition:width .5s cubic-bezier(.4,0,.2,1)}
.track .ticks{
  --seg:5%;
  position:absolute;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(var(--seg) - 1px),rgba(128,128,128,.28) calc(var(--seg) - 1px),rgba(128,128,128,.28) var(--seg));
}
.track .tie{
  position:absolute;top:-1px;bottom:-1px;left:50%;width:2px;
  background:var(--ink);opacity:.55;transform:translateX(-1px);
}
.track-legend{
  display:flex;justify-content:center;align-items:baseline;
  gap:clamp(18px,6vw,44px);flex-wrap:wrap;
  margin-top:10px;
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);
}
.track-legend .stat b{
  font-weight:600;font-size:14px;color:var(--ink);
  letter-spacing:-.01em;margin-right:5px;
  font-variant-numeric:tabular-nums;
}

/* ---------- sections ---------- */
section{margin-bottom:34px}
.sec-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:12px;margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid var(--line-soft);
}
.sec-head h2{
  font-family:"Archivo",sans-serif;font-weight:700;
  font-size:15px;letter-spacing:.01em;
}
.sec-head .note{font-size:11.5px;color:var(--faint);font-family:"Azeret Mono",ui-monospace,monospace}

/* match blocks */
.session{margin-bottom:20px}
.session-bar{
  display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  margin-bottom:8px;
}
.session-bar .nm{font-weight:700;font-size:13.5px}
.session-bar .tag{
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--line);border-radius:3px;
  padding:1px 6px;
}
.matches{display:flex;flex-direction:column;gap:6px}
.match{
  display:grid;
  grid-template-columns:1fr 132px 1fr;
  align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--line-soft);
  border-radius:6px;padding:11px 14px;
  box-shadow:var(--shadow);
}
.match .who{font-size:13.5px;line-height:1.3}
.match .who.r{text-align:left}
.match .who.p{text-align:right}
.match .who .lead{font-weight:700}
.match .status{text-align:center}
.pill{
  display:inline-block;
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:11.5px;font-weight:600;letter-spacing:.06em;
  padding:4px 10px;border-radius:999px;white-space:nowrap;
  border:1px solid transparent;
}
.pill.r{background:var(--ryan-soft);color:var(--ryan);border-color:var(--ryan)}
.pill.p{background:var(--pat-soft);color:var(--pat);border-color:var(--pat)}
.pill.as{background:transparent;color:var(--muted);border-color:var(--line)}
.thru{
  display:block;margin-top:4px;
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:10.5px;letter-spacing:.07em;color:var(--faint);
}

/* schedule / accordion */
.sched{display:flex;flex-direction:column;gap:4px}
.sched-item{border-radius:6px;border:1px solid transparent;background:var(--card-2)}
.sched-item.played{border-color:var(--line-soft);background:var(--card)}
.sched-item.idle{opacity:.62}
.sched-row{
  display:grid;
  grid-template-columns:16px 118px 1fr auto 96px;
  align-items:center;gap:12px;
  padding:11px 13px;
  list-style:none;
}
.sched-row::-webkit-details-marker{display:none}
details.sched-item > .sched-row{cursor:pointer}
details.sched-item > .sched-row:hover{background:rgba(128,128,128,.06);border-radius:5px}
.sched-row:focus-visible{outline:2px solid var(--ink);outline-offset:-2px;border-radius:5px}
.chev{
  width:16px;color:var(--faint);font-size:11px;line-height:1;
  transition:transform .18s ease;
}
details[open] > .sched-row .chev{transform:rotate(90deg)}
.sched-item.static .chev{visibility:hidden}
.count{
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--faint);margin-left:8px;white-space:nowrap;
}
.panel{
  padding:2px 13px 14px;
  border-top:1px solid var(--line-soft);
  margin:0 0 0 0;
}
.panel-in{padding-top:12px}
.sched-row .when{
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:11.5px;color:var(--muted);letter-spacing:.03em;
}
.sched-row .ev{font-weight:600;font-size:13.5px}
.sched-row .worth{
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:11px;color:var(--faint);white-space:nowrap;
}
.sched-row .split{
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:13px;font-weight:600;text-align:right;white-space:nowrap;
}
.sched-row .split .r{color:var(--ryan)}
.sched-row .split .p{color:var(--pat)}
.sched-row .split .none{color:var(--faint);font-weight:400}

/* target / stableford */
.targets{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tcard{
  background:var(--card);border:1px solid var(--line-soft);
  border-radius:6px;padding:14px 16px;box-shadow:var(--shadow);
}
.tcard .lbl{font-weight:700;font-size:13px;margin-bottom:2px}
.tcard.r .lbl{color:var(--ryan)}
.tcard.p .lbl{color:var(--pat)}
.tcard .big{
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:22px;font-weight:600;letter-spacing:-.02em;
}
.tcard .of{color:var(--faint);font-size:13px;font-weight:400}
.tbar{
  position:relative;height:14px;border-radius:4px;
  background:var(--neutral-fill);margin-top:10px;overflow:hidden;
  border:1px solid var(--line-soft);
}
.tbar > i{display:block;height:100%;border-radius:3px 0 0 3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.tcard.r .tbar > i{background:var(--ryan)}
.tcard.p .tbar > i{background:var(--pat)}
/* the end of the bar is the quota; the "95 of 91" above it says so in words,
   so no label goes inside where a near-full fill would sit under it */
.tcard.lead{border-color:currentColor}
.tcard.r.lead{border-color:var(--ryan)}
.tcard.p.lead{border-color:var(--pat)}
.tcard .lbl{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.ahead{
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
}
.stand{
  display:inline-block;margin-top:2px;
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:11px;letter-spacing:.04em;color:var(--muted);
}
.stand.over{color:var(--ink);font-weight:600}

/* per-player target list */
.tlist{
  margin-top:12px;padding-top:10px;
  border-top:1px solid var(--line-soft);
  display:flex;flex-direction:column;gap:7px;
}
.tplr{
  display:grid;grid-template-columns:1fr auto;
  align-items:baseline;gap:8px;
}
.tplr .nm{font-size:12.5px}
.tplr .thru-sm{
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:9.5px;color:var(--faint);margin-left:6px;letter-spacing:.05em;
}
.tplr .val{
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;
}
.tplr .val .of{color:var(--faint)}
.tplr .no-target{color:var(--faint);font-size:11px}
.tplr.hit .val{font-weight:600}
.tcard.r .tplr.hit .val{color:var(--ryan)}
.tcard.p .tplr.hit .val{color:var(--pat)}
.pbar{
  grid-column:1 / -1;height:3px;border-radius:2px;
  background:var(--neutral-fill);overflow:hidden;margin-top:1px;
}
.pbar > i{display:block;height:100%;border-radius:2px;transition:width .4s}
.tcard.r .pbar > i{background:var(--ryan);opacity:.75}
.tcard.p .pbar > i{background:var(--pat);opacity:.75}
.panel-note{
  margin:12px 0 0;font-size:11.5px;color:var(--faint);line-height:1.5;
}

/* how the 3 points fall */
.award{
  margin-top:14px;padding:11px 14px;
  border:1px solid var(--line);border-radius:6px;
  background:var(--card-2);
  display:flex;flex-direction:column;gap:3px;
}
.award.final{border-color:var(--ink);background:var(--card)}
.award-lbl{
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);
}
.award-val{
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;
  font-weight:700;font-size:14.5px;
}
.award-val .r{color:var(--ryan)}
.award-val .p{color:var(--pat)}
.award-val .sep{color:var(--line);font-weight:400}
.award-why{
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:10px;letter-spacing:.04em;color:var(--faint);
}

/* rosters */
.rosters{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.roster{
  background:var(--card);border:1px solid var(--line-soft);
  border-radius:6px;padding:6px 4px;box-shadow:var(--shadow);
}
.roster h3{
  font-family:"Archivo Black","Archivo",sans-serif;font-size:12px;
  letter-spacing:.06em;text-transform:uppercase;
  padding:9px 12px 8px;border-bottom:1px solid var(--line-soft);margin-bottom:3px;
}
.roster.r h3{color:var(--ryan)}
.roster.p h3{color:var(--pat)}
.plr{
  display:flex;justify-content:space-between;align-items:baseline;
  gap:10px;padding:6px 12px;font-size:13.5px;
}
.plr .hcp{
  font-family:"Azeret Mono",ui-monospace,monospace;
  font-size:12px;color:var(--muted);
}

/* states */
.empty{
  border:1px dashed var(--line);border-radius:6px;
  padding:18px 16px;color:var(--muted);font-size:13px;text-align:center;
}
.banner{
  border:1px solid var(--ryan);background:var(--ryan-soft);
  color:var(--ink);border-radius:6px;padding:13px 15px;
  font-size:13.5px;margin-bottom:22px;
}
.banner b{color:var(--ryan)}
.skel{color:var(--faint)}
footer{
  margin-top:40px;padding-top:16px;border-top:1px solid var(--line-soft);
  font-size:11.5px;color:var(--faint);
  font-family:"Azeret Mono",ui-monospace,monospace;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
footer a{color:var(--muted)}

@media (max-width:640px){
  /* the two teams keep flanking the score on a phone — that face-off, and the
     colour either side of it, is the whole point of a Ryder Cup board */
  .score-row{grid-template-columns:1fr auto 1fr;gap:clamp(6px,2.5vw,12px)}
  .team-name{font-size:clamp(11px,3.6vw,15px);letter-spacing:0}
  .team-sub{font-size:9px;letter-spacing:.05em;margin-top:4px}
  /* leave room for a two-digit half score like 4½ / 3½ without the team
     names wrapping beside it */
  .tally{font-size:clamp(26px,9vw,38px);gap:clamp(5px,2vw,10px)}
  .tally .dash{font-size:.5em}

  .match{grid-template-columns:1fr auto 1fr;gap:8px;padding:10px 11px}
  .match .who{font-size:12px;line-height:1.25}
  .pill{font-size:10px;padding:3px 8px;letter-spacing:.04em}
  .thru{font-size:9.5px;margin-top:3px}
  .sched-row{
    grid-template-columns:16px 1fr auto;
    grid-template-areas:"chev when split" ". ev worth";
    column-gap:8px;row-gap:3px;
  }
  .sched-row .chev{grid-area:chev;align-self:start;margin-top:3px}
  .sched-row .when{grid-area:when}
  .sched-row .split{grid-area:split}
  .sched-row .ev{grid-area:ev}
  .sched-row .worth{grid-area:worth;text-align:right}
  .panel{padding-inline:11px}
  .targets,.rosters{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>2026 Ryder Cup</h1>
    </div>
    <div class="meta">
      <span class="mono" id="stamp">loading…</span>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </div>

  <div id="banner"></div>

  <div class="scoreboard">
    <div class="score-row">
      <div class="side-r">
        <div class="team-name" id="nameR">Team Ryan</div>
        <div class="team-sub" id="subR">&nbsp;</div>
      </div>
      <div class="tally">
        <span class="r" id="ptsR">–</span>
        <span class="dash">/</span>
        <span class="p" id="ptsP">–</span>
      </div>
      <div class="side-p">
        <div class="team-name" id="nameP">Team Pat</div>
        <div class="team-sub" id="subP">&nbsp;</div>
      </div>
    </div>

    <div class="track" id="track">
      <div class="fill-r" id="fillR" style="width:0%"></div>
      <div class="fill-spacer"></div>
      <div class="fill-p" id="fillP" style="width:0%"></div>
      <div class="ticks" id="ticks"></div>
      <div class="tie"></div>
    </div>
    <div class="track-legend">
      <span class="stat"><b id="ptsAvail">&mdash;</b> Points Available</span>
      <span class="stat"><b id="ptsWin">&mdash;</b> Points to Win</span>
    </div>
  </div>

  <section id="schedSec">
    <div class="sec-head">
      <h2>Schedule &amp; matches</h2>
      <span class="note" id="schedNote"></span>
    </div>
    <div class="sched" id="sched"></div>
  </section>

  <section id="rosterSec">
    <div class="sec-head">
      <h2>The teams</h2>
      <span class="note">handicap index</span>
    </div>
    <div class="rosters" id="rosters"></div>
  </section>

  <footer>
    <span id="foot">Reads the Google Sheet directly · auto-refreshes every 60s</span>
    <a id="sheetLink" href="#" target="_blank" rel="noopener">Open the sheet →</a>
  </footer>
</div>

<script>
(function(){
"use strict";

/* ============================================================
   SHEET CONFIG — change these if the sheet moves or tabs change
   ============================================================ */
var SHEET_ID = "1jc1DmvMY0DLlh-u783BiZv_NxIWNsyybIuTX1nSsOJM";

var TABS = {
  scoreboard:   { gid: "0",          name: "Scoreboard" },
  handicaps:    { gid: "698972896",  name: "Handicapables" },
  targetScores: { gid: "1157715113", name: "Target Scores" },
  target:       { gid: "117572123",  name: "Target" }
};

/* Each match session: which tab it lives on, and what it's called. */
var SESSIONS = [
  { key:"lowball", gid:"834167955",  name:"Low Ball, Low Total", label:"Low Ball, Low Total", when:"Friday AM" },
  { key:"altshot", gid:"963762264",  name:"Alt Shot",            label:"Alternate Shot",      when:"Friday PM" },
  { key:"singles", gid:"1677617188", name:"Match Play",          label:"Match Play — Singles",when:"Saturday AM" }
];

var REFRESH_MS = 60000;

/* Which handicap tier the Stableford round plays to. These are column indexes
   on the Target Scores tab, Ryan's side then Pat's:
     full Target = 2 / 7   ·   90% = 3 / 8   ·   85% = 4 / 9
   Currently 85%, which is what the sheet's own Remaining row measures against. */
var TARGET_TIER = { r: 4, p: 9, label: "85%" };

/* ============================================================ */

var $ = function(id){ return document.getElementById(id); };
/* only touch the DOM when something actually changed, so a 60s refresh
   doesn't blink the page or throw away the reader's scroll position */
var setHTML = function(el, html){ if(el && el.innerHTML !== html) el.innerHTML = html; };
var setText = function(el, txt){ if(el && el.textContent !== txt) el.textContent = txt; };
var esc = function(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;");
};

/* gviz reads the sheet live. The /export endpoint is served from a cache that can
   sit several minutes behind your edits, so it is only the fallback. Every column
   in the layouts below is single-typed, which keeps gviz from nulling cells. */
function sheetUrl(gid, name){
  var base = "https://docs.google.com/spreadsheets/d/" + SHEET_ID;
  var bust = "&_=" + Date.now() + "." + Math.random().toString(36).slice(2, 8);
  return {
    primary:  base + "/gviz/tq?tqx=out:csv&headers=0&gid=" + encodeURIComponent(gid) + bust,
    fallback: base + "/export?format=csv&gid=" + encodeURIComponent(gid) + bust
  };
}

/* --- CSV --- */
function parseCSV(text){
  var rows = [], row = [], field = "", q = false, i, c;
  for(i = 0; i < text.length; i++){
    c = text.charAt(i);
    if(q){
      if(c === '"'){
        if(text.charAt(i+1) === '"'){ field += '"'; i++; }
        else { q = false; }
      } else { field += c; }
    } else {
      if(c === '"'){ q = true; }
      else if(c === ","){ row.push(field); field = ""; }
      else if(c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(c === "\r"){ /* skip */ }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function cell(row, i){
  if(!row || i >= row.length || row[i] == null) return "";
  return String(row[i]).trim();
}
function num(v){
  if(v == null) return null;
  var s = String(v).replace(/[^0-9.\-]/g, "");
  if(s === "" || s === "-" || s === ".") return null;
  var n = parseFloat(s);
  return isNaN(n) ? null : n;
}
function fmtPts(n){
  if(n == null) return "–";
  var whole = Math.floor(n);
  var half  = (n - whole) >= 0.5;
  if(half) return (whole === 0 ? "" : String(whole)) + "½";
  return String(whole);
}

/* The live endpoint types each column and blanks cells that disagree. A Thru
   column holding both hole numbers and an "F" can therefore come back with the
   F's missing, which would show finished matches as still in play. When a tab's
   scores are filled in but every Thru is empty, re-read that one tab from the
   faithful endpoint instead. */
function thruLooksEaten(list){
  if(!list.length) return false;
  var anyScore = false, anyThru = false, i;
  for(i = 0; i < list.length; i++){
    if(list[i].up != null) anyScore = true;
    if(list[i].thru) anyThru = true;
  }
  return anyScore && !anyThru;
}

async function grabExport(gid){
  var r = await fetch(sheetUrl(gid, "").fallback, { cache: "no-store" });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return parseCSV(await r.text());
}

async function grab(gid, name){
  var u = sheetUrl(gid, name), r;
  try{
    r = await fetch(u.primary, { cache: "no-store" });
    if(r.ok) return parseCSV(await r.text());
  }catch(e){ /* fall through */ }
  r = await fetch(u.fallback, { cache: "no-store" });
  if(!r.ok) throw new Error("HTTP " + r.status + " on " + name);
  return parseCSV(await r.text());
}

/* --- parse: Scoreboard tab --- */
function readScoreboard(rows){
  var out = {
    teamR:"Team Ryan", teamP:"Team Pat",
    schedule:[], rosterR:[], rosterP:[],
    overallR:null, overallP:null
  };
  var h = -1, i;
  for(i = 0; i < rows.length; i++){
    if(cell(rows[i],1).toLowerCase() === "round"){ h = i; break; }
  }
  if(h === -1) h = 1;

  /* gviz nulls these headers because they sit in numeric columns; the roster
     fallback below fills them in, so team names survive either endpoint. */
  if(cell(rows[h],9))  out.teamR = cell(rows[h],9);
  if(cell(rows[h],10)) out.teamP = cell(rows[h],10);

  for(i = h + 1; i < rows.length; i++){
    var round = cell(rows[i],1);
    if(!round) break;
    var pts = num(cell(rows[i],5));
    out.schedule.push({
      round: round,
      tee:   cell(rows[i],3),
      event: cell(rows[i],4),
      pts:   pts,
      hcp:   cell(rows[i],6),
      r:     num(cell(rows[i],9)),
      p:     num(cell(rows[i],10))
    });
  }

  for(i = h + 1; i < rows.length; i++){
    var nR = cell(rows[i],12), nP = cell(rows[i],14);
    if(!nR && !nP) break;
    if(nR) out.rosterR.push({ name:nR, hcp:cell(rows[i],13) });
    if(nP) out.rosterP.push({ name:nP, hcp:cell(rows[i],15) });
  }

  if(out.teamR === "Team Ryan" && out.rosterR.length) out.teamR = "Team " + out.rosterR[0].name;
  if(out.teamP === "Team Pat"  && out.rosterP.length) out.teamP = "Team " + out.rosterP[0].name;

  for(i = 0; i < rows.length; i++){
    var joined = rows[i].join(" ").toUpperCase();
    if(joined.indexOf("OVERALL SCORE") !== -1){
      var nx = rows[i+1];
      if(nx){ out.overallR = num(cell(nx,9)); out.overallP = num(cell(nx,10)); }
      break;
    }
  }
  if(out.overallR == null && out.overallP == null){
    for(i = rows.length - 1; i >= 0; i--){
      if(!cell(rows[i],1) && (cell(rows[i],9) !== "" || cell(rows[i],10) !== "")){
        out.overallR = num(cell(rows[i],9));
        out.overallP = num(cell(rows[i],10));
        break;
      }
    }
  }
  return out;
}

/* --- parse: a match tab ---------------------------------------
   Expected header row, in this order, starting in any column:
     Match | Team Ryan | Team Pat | Leader | Up | Thru | Result
   The header is located by name, so a leading spacer column (or a
   couple of blank rows above it) doesn't matter.

   Result is what marks a match finished, and it is a text column on
   purpose: Google's live endpoint decides a column's type from its
   values and blanks out anything that disagrees, so a stray "F" in
   the otherwise-numeric Thru column would silently vanish.
---------------------------------------------------------------- */
function findLayout(rows){
  var i, j;
  /* best anchor: the Leader column, which sits 3 across from Match */
  for(i = 0; i < rows.length; i++){
    for(j = 0; j < rows[i].length; j++){
      if(/^leader$/i.test(cell(rows[i],j))){
        return { header:i, base: Math.max(0, j - 3) };
      }
    }
  }
  /* fallback: the "Team X" heading, which sits 1 across from Match */
  for(i = 0; i < rows.length; i++){
    for(j = 0; j < rows[i].length; j++){
      if(/^team\s+\S/i.test(cell(rows[i],j))){
        return { header:i, base: Math.max(0, j - 1) };
      }
    }
  }
  return null;
}

/* --- vertical block layout (the Match Play tab) -----------------
       B        C          D        E
   2   Team     Match #1   Score    Thru
   3   Pat      <player>   <up>     <thru, merged down the pair>
   4   Ryan     <player>   <up>

   Score is "how many up that side is", so only the leading row
   carries a number; both blank or both zero means all square.
------------------------------------------------------------------ */
function readVertical(rows, teams){
  var i, j, blocks = [];
  for(i = 0; i < rows.length; i++){
    for(j = 0; j < rows[i].length; j++){
      /* a digit is required, so the horizontal layout's bare "Match"
         header never reads as a block and falls through below */
      if(/^match\s*#?\s*\d+$/i.test(cell(rows[i],j))){ blocks.push({ row:i, col:j }); break; }
    }
  }
  if(!blocks.length) return [];

  var rKey = normName(teams.rCaptain), pKey = normName(teams.pCaptain);
  var list = [];

  for(var b = 0; b < blocks.length; b++){
    var hdr = blocks[b];
    if(hdr.col < 1) continue;
    var end      = (b + 1 < blocks.length) ? blocks[b+1].row : rows.length;
    var teamCol  = hdr.col - 1, nameCol = hdr.col,
        scoreCol = hdr.col + 1, thruCol = hdr.col + 2;

    var rName = "", pName = "", rUp = null, pUp = null, thru = "";

    for(i = hdr.row + 1; i < end; i++){
      var label = normName(cell(rows[i], teamCol));
      if(!label) continue;
      /* a merged Thru cell reports its value on the block's first row */
      if(!thru) thru = cell(rows[i], thruCol);

      var nm = cell(rows[i], nameCol), sc = num(cell(rows[i], scoreCol));
      if(label === rKey || label === "team" + rKey){ rName = nm; rUp = sc; }
      else if(label === pKey || label === "team" + pKey){ pName = nm; pUp = sc; }
    }

    if(!rName && !pName) continue;   /* block not filled in yet */

    /* Two scoring conventions share this layout, told apart by how many
       Score cells are filled:
         Match Play  — only the leader carries a number  -> "2 UP"
         Low Ball    — both sides carry a running tally  -> "3-1"
       Checked for presence, not truthiness, so a real 0 still counts. */
    var rHas = rUp !== null, pHas = pUp !== null;
    var side = "as", up = null, tally = "";

    if(rHas && pHas){
      if(rUp > pUp){ side = "r"; up = rUp - pUp; tally = rUp + "–" + pUp; }
      else if(pUp > rUp){ side = "p"; up = pUp - rUp; tally = pUp + "–" + rUp; }
      /* equal leaves it all square */
    } else if(rHas && rUp){ side = "r"; up = rUp; }
    else if(pHas && pUp){ side = "p"; up = pUp; }

    list.push({
      no:      cell(rows[hdr.row], hdr.col).replace(/^match\s*#?\s*/i, ""),
      r:       rName,
      p:       pName,
      side:    side,
      up:      up,
      tally:   tally,
      thru:    thru,
      result:  "",
      started: rHas || pHas || !!thru,
      done:    /^f/i.test(thru) || num(thru) === 18
    });
  }
  return list;
}

function readMatches(rows, teams){
  var v = readVertical(rows, teams || {});
  if(v.length) return v;

  var lay = findLayout(rows);
  if(!lay) return [];          /* neither layout recognised */

  var b = lay.base, list = [], i;
  for(i = lay.header + 1; i < rows.length; i++){
    var rSide = cell(rows[i], b + 1);
    var pSide = cell(rows[i], b + 2);
    if(!rSide && !pSide) continue;

    var leaderRaw = cell(rows[i], b + 3);
    var thruRaw   = cell(rows[i], b + 5);
    var result    = cell(rows[i], b + 6);

    var side = "as";
    if(/^r/i.test(leaderRaw)) side = "r";
    else if(/^p/i.test(leaderRaw)) side = "p";
    if(/halve|^as$|^a\/s$/i.test(result)) side = "as";

    list.push({
      no:      cell(rows[i], b) || String(list.length + 1),
      r:       rSide,
      p:       pSide,
      side:    side,
      up:      num(cell(rows[i], b + 4)),
      thru:    thruRaw,
      result:  result,
      started: true,
      done:    !!result || /^f/i.test(thruRaw) || num(thruRaw) === 18
    });
  }
  return list;
}

/* --- parse: Target Scores tab -----------------------------------
   Top block, one row per player:
     A name | B hcp | C target | D 90% | E 85%   (Ryan side)
     F name | G hcp | H target | I 90% | J 85%   (Pat side)
   The 90% column is the live one — the team Remaining figures (91 / 117)
   are its totals — so that is the target each player is measured against.
   Bottom block ends with Total (points so far) and Remaining.
------------------------------------------------------------------ */
function readTargets(rows, rosterR, rosterP){
  var got = { rNow:null, rLeft:null, pNow:null, pLeft:null,
              rTarget:null, pTarget:null, rPlayers:[], pPlayers:[] };
  var i;

  for(i = 0; i < rows.length; i++){
    var lbl = cell(rows[i],0).toLowerCase();
    if(lbl === "total"){
      got.rNow = num(cell(rows[i],1));
      got.pNow = num(cell(rows[i],6));
    } else if(lbl === "remaining"){
      got.rLeft = num(cell(rows[i],1));
      got.pLeft = num(cell(rows[i],6));
    } else if(/^team target/i.test(cell(rows[i],0))){
      /* authoritative team quotas, 90% column — taken from here rather than
         derived from Remaining, whose sign convention is still in flux */
      got.rTarget = num(cell(rows[i], TARGET_TIER.r));
      got.pTarget = num(cell(rows[i], TARGET_TIER.p));
    }
  }

  /* Per-player targets are found by matching the roster names rather than by
     locating the HCP header row — the live endpoint nulls that header, since
     it is text sitting in a numeric column. The same names appear again lower
     down as negatives, so only the first positive value is taken. */
  var pick = function(roster, nameCol, valCol){
    return (roster || []).map(function(p){
      var target = null, j;
      for(j = 0; j < rows.length; j++){
        if(normName(cell(rows[j], nameCol)) !== normName(p.name)) continue;
        var v = num(cell(rows[j], valCol));
        if(v != null && v > 0){ target = v; break; }
      }
      return { name: p.name, hcp: p.hcp, target: target };
    });
  };

  got.rPlayers = pick(rosterR, 0, TARGET_TIER.r);
  got.pPlayers = pick(rosterP, 5, TARGET_TIER.p);
  return got;
}

/* --- parse: Target tab (the Stableford scorecard) ----------------
   Repeating 5-row blocks, two players side by side:
     row 0  <Ryan player> 1 2 3 … 18      | col 21 <Pat player> 1 2 … 18
     row 1  Par …
     row 2  Gross …
     row 3  Net …
     row 4  Stableford  <per-hole points>
   Returns points so far and holes played, keyed by player name.
------------------------------------------------------------------ */
function readStableford(rows){
  var out = Object.create(null);
  var rName = "", pName = "", i, j;

  var sumRow = function(row, from){
    var total = 0, any = false, k;
    for(k = from; k < from + 18; k++){
      var v = num(cell(row, k));
      if(v != null){ total += v; any = true; }
    }
    return any ? total : null;
  };
  var playedRow = function(row, from){
    var n = 0, k;
    for(k = from; k < from + 18; k++) if(cell(row, k) !== "") n++;
    return n;
  };

  for(i = 0; i < rows.length; i++){
    var c0 = cell(rows[i],0);
    /* a block header carries the hole numbers 1,2,… beside the name */
    if(c0 && cell(rows[i],1) === "1" && cell(rows[i],2) === "2"){
      rName = c0;
      pName = cell(rows[i],21);
      continue;
    }
    if(/^gross$/i.test(c0)){
      if(rName) (out[rName] = out[rName] || {}).played = playedRow(rows[i], 1);
      if(pName) (out[pName] = out[pName] || {}).played = playedRow(rows[i], 22);
      continue;
    }
    if(/^stableford$/i.test(c0)){
      if(rName) (out[rName] = out[rName] || {}).pts = sumRow(rows[i], 1);
      if(pName) (out[pName] = out[pName] || {}).pts = sumRow(rows[i], 22);
    }
  }
  return out;
}

/* ---------- render ---------- */

function renderScore(sb){
  $("nameR").textContent = sb.teamR;
  $("nameP").textContent = sb.teamP;

  var totalAvail = 0;
  sb.schedule.forEach(function(s){ if(s.pts != null) totalAvail += s.pts; });

  var sumR = 0, sumP = 0;
  sb.schedule.forEach(function(s){
    var v = roundPts(s);
    if(v.r != null) sumR += v.r;
    if(v.p != null) sumP += v.p;
  });
  /* the sheet's OVERALL cells win only when someone has actually put a number
     in them; otherwise the rounds below are the truth */
  var useOverall = (sb.overallR || 0) !== 0 || (sb.overallP || 0) !== 0;
  var R = useOverall ? sb.overallR : sumR;
  var P = useOverall ? sb.overallP : sumP;

  $("ptsR").textContent = fmtPts(R);
  $("ptsP").textContent = fmtPts(P);

  var toWin = totalAvail > 0 ? (totalAvail / 2) + 0.5 : null;
  var played = R + P;
  var left = Math.max(0, totalAvail - played);

  if(toWin != null){
    $("subR").textContent = (R >= toWin) ? "CUP WON" : fmtPts(toWin - R) + " to clinch";
    $("subP").textContent = (P >= toWin) ? "CUP WON" : fmtPts(toWin - P) + " to clinch";
  }

  var pct = function(v){ return totalAvail > 0 ? (v / totalAvail) * 100 : 0; };
  $("fillR").style.width = pct(R) + "%";
  $("fillP").style.width = pct(P) + "%";
  if(totalAvail > 0){
    $("ticks").style.setProperty("--seg", (100 / totalAvail) + "%");
  }

  setText($("ptsAvail"), totalAvail > 0 ? fmtPts(left) : "—");
  setText($("ptsWin"),   toWin != null ? fmtPts(toWin) : "—");

  $("schedNote").textContent = totalAvail > 0 ? totalAvail + " points in play" : "";
  return { R:R, P:P, teamR:sb.teamR, teamP:sb.teamP };
}

/* which schedule rows the reader has opened — kept across refreshes so a
   60s reload never folds a panel shut while someone is reading it */
var openRows = Object.create(null);

function normName(s){ return String(s || "").toLowerCase().replace(/[^a-z0-9]/g, ""); }

function sessionFor(event){
  for(var i = 0; i < SESSIONS.length; i++){
    if(normName(SESSIONS[i].name) === normName(event)) return SESSIONS[i];
  }
  return null;
}

/* A match is worth a point, awarded the moment it reads final — Thru 18 (or F).
   A halved match splits it. These land on each schedule row as rCalc/pCalc. */
function applyMatchPoints(sb, bySession, tg, sf){
  sb.schedule.forEach(function(s){
    if(normName(s.event) === "stableford"){
      var award = stablefordAward(tg, s.pts);
      if(award){
        s.sfAward = award;
        s.sfFinal = stablefordComplete(tg, sf);
        if(s.sfFinal){ s.rCalc = award.r; s.pCalc = award.p; }
      }
      return;
    }
    var sess = sessionFor(s.event);
    if(!sess) return;
    var list = bySession[sess.key] || [], r = 0, p = 0, decided = 0;
    list.forEach(function(m){
      if(!m.done) return;
      decided++;
      if(m.side === "as"){ r += 0.5; p += 0.5; }
      else if(m.side === "r") r += 1;
      else p += 1;
    });
    s.matches = list.length;
    s.decided = decided;
    if(decided){ s.rCalc = r; s.pCalc = p; }
  });
}

/* --- Stableford: how the round's points are split -----------------
   Reach your target when the other side doesn't and you take all of them.
   If both reach, or neither does, it splits — 2 to the better side, 1 to
   the other (written as total-1 / 1 so it follows the sheet's Pts cell).

   "Better" means further above your own target, or less far below it —
   the same measure as everywhere else on this page. Raw points can't
   decide it: the two sides play to different quotas because Pat's team
   carries an extra player for this event.
------------------------------------------------------------------- */
function stablefordAward(t, total){
  if(t.rTarget == null || t.pTarget == null || !total) return null;

  var rNow = t.rNow || 0, pNow = t.pNow || 0;
  var rHit = rNow >= t.rTarget, pHit = pNow >= t.pTarget;
  var rStand = rNow - t.rTarget, pStand = pNow - t.pTarget;

  if(rHit && !pHit) return { r: total, p: 0, why: "hit target, Pat didn't" };
  if(pHit && !rHit) return { r: 0, p: total, why: "hit target, Ryan didn't" };

  var why = rHit ? "both hit target" : "neither hit target";
  if(rStand > pStand) return { r: total - 1, p: 1, why: why };
  if(pStand > rStand) return { r: 1, p: total - 1, why: why };
  return { r: total / 2, p: total / 2, why: "dead level" };
}

/* The award only counts once the round is actually over. Completion is
   every quota-carrying player showing 18 holes on the Target tab — until
   then the panel shows it as provisional and the round stays unscored. */
function stablefordComplete(t, sf){
  var players = (t.rPlayers || []).concat(t.pPlayers || []);
  var counted = 0, i, live;
  for(i = 0; i < players.length; i++){
    if(players[i].target == null) continue;
    live = sf[players[i].name];
    if(!live || live.played !== 18) return false;
    counted++;
  }
  return counted > 0;
}

/* What a round is actually worth right now. A figure typed into Scoreboard
   J/K always wins — that is Pat's override — but while those sit at zero the
   finished matches speak for themselves, so the board never shows 0-0 with
   decided matches sitting under it. */
function roundPts(s){
  var typed = (s.r != null && s.r !== 0) || (s.p != null && s.p !== 0);
  if(typed) return { r: s.r || 0, p: s.p || 0, derived: false };
  if(s.rCalc != null) return { r: s.rCalc, p: s.pCalc, derived: true };
  return { r: s.r, p: s.p, derived: false };
}

function renderSchedule(sb, bySession, tg, sf, teamR, teamP){
  var html = sb.schedule.map(function(s){
    var pv       = roundPts(s);
    var hasScore = (pv.r != null || pv.p != null);
    var scored   = hasScore && s.pts != null;

    var worth = s.pts != null ? s.pts + " pt" + (s.pts === 1 ? "" : "s") : "no points";
    if(s.hcp === "Y") worth += " · hcp";
    else if(s.hcp === "N") worth += " · scratch";

    var split = scored
      ? '<span class="r">' + fmtPts(pv.r || 0) + '</span> <span style="opacity:.4">/</span> ' +
        '<span class="p">' + fmtPts(pv.p || 0) + '</span>'
      : '<span class="none">—</span>';

    var sess = sessionFor(s.event);
    var list = sess ? (bySession[sess.key] || []) : [];

    var isStableford = normName(s.event) === "stableford";
    var hasTargets   = isStableford &&
                       (tg.rTarget != null || tg.pTarget != null ||
                        tg.rLeft != null || tg.pLeft != null);

    var panel = "", count = "";
    if(sess){
      panel = matchesPanel(list, teamR, teamP);
      var tag;
      if(!list.length)                    tag = "not set";
      else if(s.decided === 0)            tag = list.length + " match" + (list.length === 1 ? "" : "es");
      else if(s.decided < list.length)    tag = s.decided + " of " + list.length + " final";
      else                                tag = "all final";
      count = '<span class="count">' + tag + '</span>';
    } else if(hasTargets){
      panel = targetsPanel(tg, sf || {}, teamR, teamP, s);
      count = '<span class="count">' +
              (s.sfFinal ? "final" : "vs target") + '</span>';
    }

    /* Rounds carrying no points and nothing to expand — Warmup, Scramble,
       Sunday AM — are left off entirely. Driven off the data rather than a
       name list, so assigning Scramble points later brings its row back. */
    if(s.pts == null && !panel) return "";

    var when = esc(s.round) + (s.tee ? " · " + esc(s.tee) : "");
    var row =
      '<span class="chev">▶</span>' +
      '<span class="when">' + when + '</span>' +
      '<span class="ev">' + esc(s.event || "—") + count + '</span>' +
      '<span class="worth">' + esc(worth) + '</span>' +
      '<span class="split">' + split + '</span>';

    var cls = "sched-item" + (scored ? " played" : "") +
              (s.pts == null && !panel ? " idle" : "");

    if(!panel){
      return '<div class="' + cls + ' static"><div class="sched-row">' + row + '</div></div>';
    }
    var key = normName(s.round) + "-" + normName(s.event);
    return '<details class="' + cls + '" data-key="' + key + '"' +
             (openRows[key] ? " open" : "") + '>' +
             '<summary class="sched-row">' + row + '</summary>' +
             '<div class="panel"><div class="panel-in">' + panel + '</div></div>' +
           '</details>';
  }).join("");

  setHTML($("sched"), html);
}

function statusPill(m, teamR, teamP){
  if(m.started === false){
    return '<span class="pill as">TO PLAY</span>';
  }
  if(m.side === "as"){
    return '<span class="pill as">' + (m.done ? "HALVED" : "ALL SQUARE") + '</span>';
  }
  var txt;
  if(m.result){
    /* whatever they wrote — "3&2", "2 UP", "1 up" — shown as-is */
    txt = m.result.toUpperCase();
  } else if(m.tally){
    /* both sides scored, so show the running tally rather than a margin */
    txt = m.tally;
  } else if(m.done){
    txt = (m.side === "r" ? teamR : teamP).replace(/^team\s+/i, "").toUpperCase() + " WINS";
  } else {
    txt = (m.up != null ? m.up : 1) + " UP";
  }
  return '<span class="pill ' + m.side + '">' + esc(txt) + '</span>';
}

function matchesPanel(list, teamR, teamP){
  if(!list.length){
    return '<div class="empty"><b>No pairings read from this tab yet.</b><br>' +
           'Blocks of <b>Match #N · Score · Thru</b> with a team name and player ' +
           'on the two rows beneath, and the names filled in.</div>';
  }
  return '<div class="matches">' + list.map(function(m){
    var thruTxt = m.started === false ? ""
                : m.done ? "FINAL"
                : (m.thru ? "THRU " + esc(m.thru) : "");
    return '<div class="match">' +
             '<span class="who r"><span class="' + (m.side === "r" ? "lead" : "") + '">' +
               esc(m.r || "—") + '</span></span>' +
             '<span class="status">' + statusPill(m, teamR, teamP) +
               (thruTxt ? '<span class="thru">' + thruTxt + '</span>' : '') +
             '</span>' +
             '<span class="who p"><span class="' + (m.side === "p" ? "lead" : "") + '">' +
               esc(m.p || "—") + '</span></span>' +
           '</div>';
  }).join("") + '</div>';
}

function targetsPanel(t, sf, teamR, teamP, s){
  /* The round is won by points-minus-target: beating your quota by the most,
     or falling short of it by the least. Computed here from the Team Target
     row rather than read from the sheet's Remaining cell, so it stays correct
     whichever direction that formula ends up running. */
  var rStand = (t.rTarget != null) ? (t.rNow || 0) - t.rTarget : null;
  var pStand = (t.pTarget != null) ? (t.pNow || 0) - t.pTarget : null;
  /* Quotas differ by design — Pat's side carries an extra player for this
     event — so the gap only means something once points are on the board.
     Before then, neither side is "ahead". */
  var live   = (t.rNow || 0) > 0 || (t.pNow || 0) > 0;
  var leader = (!live || rStand == null || pStand == null) ? null
             : (rStand > pStand ? "r" : (pStand > rStand ? "p" : null));

  var chip = function(v){
    if(v == null) return "";
    var s = (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(Math.round(v * 10) / 10);
    return '<span class="stand' + (v >= 0 ? " over" : "") + '">' + s + ' vs target</span>';
  };

  var card = function(cls, label, now, target, players, stand, isLead){
    /* the bar is the quota: full means the team has hit its number */
    var pctv = target > 0 ? Math.min(100, ((now || 0) / target) * 100) : 0;
    var beat = target > 0 && (now || 0) >= target;

    var rows = players.map(function(p){
      var live = sf[p.name] || {};
      var pts  = live.pts;
      var hit  = p.target != null && pts != null && pts >= p.target;

      /* a player with no quota set still shows what he has scored */
      var val = (pts == null ? "0" : pts) +
                (p.target == null
                  ? '<span class="of"> / —</span>'
                  : '<span class="of"> / ' + p.target + '</span>');

      var bar = "";
      if(p.target != null){
        var w = Math.min(100, ((pts || 0) / p.target) * 100);
        bar = '<div class="pbar"><i style="width:' + w + '%"></i></div>';
      }

      return '<div class="tplr' + (hit ? " hit" : "") + '">' +
               '<span class="nm">' + esc(p.name) +
                 (live.played ? '<span class="thru-sm">thru ' + live.played + '</span>' : '') +
               '</span>' +
               '<span class="val">' + val + '</span>' +
               bar +
             '</div>';
    }).join("");

    return '<div class="tcard ' + cls + (isLead ? " lead" : "") + '">' +
             '<div class="lbl">' + esc(label) +
               (isLead ? '<span class="ahead">ahead</span>' : '') + '</div>' +
             '<div class="big">' + (now == null ? "0" : now) +
               ' <span class="of">of ' + (target == null ? "—" : target) + '</span></div>' +
             chip(stand) +
             '<div class="tbar' + (beat ? " beat" : "") + '">' +
               '<i style="width:' + pctv + '%"></i>' +
             '</div>' +
             (rows ? '<div class="tlist">' + rows + '</div>' : '') +
           '</div>';
  };

  /* how the round's points fall under the sweep / 2-1 rule */
  var award = "";
  if(s && s.sfAward){
    var a = s.sfAward;
    award =
      '<div class="award' + (s.sfFinal ? " final" : "") + '">' +
        '<span class="award-lbl">' + (s.sfFinal ? "Round points" : "As it stands") + '</span>' +
        '<span class="award-val">' +
          '<span class="r">' + esc(teamR) + ' ' + fmtPts(a.r) + '</span>' +
          '<span class="sep">·</span>' +
          '<span class="p">' + esc(teamP) + ' ' + fmtPts(a.p) + '</span>' +
        '</span>' +
        '<span class="award-why">' + esc(a.why) +
          (s.sfFinal ? "" : " — not final until all 18 are in") + '</span>' +
      '</div>';
  }

  return '<div class="targets">' +
         card("r", teamR, t.rNow, t.rTarget, t.rPlayers || [], rStand, leader === "r") +
         card("p", teamP, t.pNow, t.pTarget, t.pPlayers || [], pStand, leader === "p") +
         '</div>' + award +
         '<p class="panel-note">Targets are the <b>' + TARGET_TIER.label + '</b> figures. ' +
         'Reach your target while the other side doesn’t and you ' +
         'take all 3. If both reach, or neither does, it’s 2 to the side further above ' +
         'its own target — or less far below it — and 1 to the other.</p>';
}

function renderRosters(sb){
  var mk = function(cls, label, list){
    var body = list.map(function(p){
      return '<div class="plr"><span>' + esc(p.name) + '</span>' +
             '<span class="hcp">' + esc(p.hcp || "—") + '</span></div>';
    }).join("");
    return '<div class="roster ' + cls + '"><h3>' + esc(label) + '</h3>' + body + '</div>';
  };
  setHTML($("rosters"), mk("r", sb.teamR, sb.rosterR) + mk("p", sb.teamP, sb.rosterP));
}

/* ---------- load ---------- */

var loading = false;
var lastOK = null;

/* A visible, ticking "read Ns ago" is the whole point: if the page ever stops
   reading the sheet, you can see it rather than guess. */
function tickStamp(){
  if(lastOK == null){ return; }
  var s = Math.round((Date.now() - lastOK) / 1000);
  var txt = s < 5 ? "just read" : (s < 90 ? "read " + s + "s ago" : "read " + Math.round(s/60) + "m ago");
  setText($("stamp"), txt);
}

async function load(){
  if(loading) return;
  loading = true;
  $("refresh").setAttribute("data-busy","1");

  try{
    var jobs = [
      grab(TABS.scoreboard.gid,   TABS.scoreboard.name),
      grab(TABS.targetScores.gid, TABS.targetScores.name),
      grab(TABS.target.gid,       TABS.target.name)
    ].concat(SESSIONS.map(function(s){ return grab(s.gid, s.name); }));

    var res = await Promise.all(jobs);

    var sb = readScoreboard(res[0]);
    var tg = readTargets(res[1], sb.rosterR, sb.rosterP);
    var sf = readStableford(res[2]);

    /* the match tabs label their rows by captain ("Pat" / "Ryan"), so the
       page reads sides by name rather than by row order */
    var teams = {
      rCaptain: sb.rosterR.length ? sb.rosterR[0].name : sb.teamR.replace(/^team\s+/i, ""),
      pCaptain: sb.rosterP.length ? sb.rosterP[0].name : sb.teamP.replace(/^team\s+/i, "")
    };

    var bySession = {}, si, sess, list;
    for(si = 0; si < SESSIONS.length; si++){
      sess = SESSIONS[si];
      list = readMatches(res[si + 3], teams);
      if(thruLooksEaten(list)){
        try{ list = readMatches(await grabExport(sess.gid), teams); }
        catch(e){ /* keep what we had */ }
      }
      bySession[sess.key] = list;
    }

    applyMatchPoints(sb, bySession, tg, sf);

    var head = renderScore(sb);
    renderSchedule(sb, bySession, tg, sf, head.teamR, head.teamP);
    renderRosters(sb);

    /* per-tab readout, so "nothing showed up" is never a mystery */
    setText($("foot"), "read " + SESSIONS.map(function(s){
      return s.name + " " + (bySession[s.key] || []).length;
    }).join(" · ") + " · auto every 60s");

    setHTML($("banner"), "");
    lastOK = Date.now();
    tickStamp();

  }catch(err){
    setHTML($("banner"),
      '<div class="banner"><b>Can’t read the sheet.</b> ' +
      'Check that it is still set to <b>Share → General access → Anyone with the link → Viewer</b>. ' +
      'If it is, the connection just dropped — it will retry on its own.<br>' +
      '<span class="mono" style="font-size:11px;opacity:.7">' + esc(err.message || err) + '</span></div>');
    setText($("stamp"), "can't reach the sheet");
  }finally{
    loading = false;
    $("refresh").removeAttribute("data-busy");
  }
}

/* remember which panels are open. `toggle` doesn't bubble, so listen in the
   capture phase on the container rather than binding every <details>. */
$("sched").addEventListener("toggle", function(e){
  var d = e.target;
  if(!d || !d.dataset || !d.dataset.key) return;
  if(d.open) openRows[d.dataset.key] = true;
  else delete openRows[d.dataset.key];
}, true);

$("sheetLink").href = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/edit";
$("refresh").addEventListener("click", load);
document.addEventListener("visibilitychange", function(){
  /* don't re-hammer the sheet every time someone glances at their phone */
  if(!document.hidden && (lastOK == null || Date.now() - lastOK > 15000)) load();
});
setInterval(load, REFRESH_MS);
setInterval(tickStamp, 1000);
load();

})();
</script>
